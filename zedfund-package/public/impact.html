<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impact — ZedFund</title>
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div id="navbar-root"></div>

<main class="container section">
  <h1 class="display-md" style="text-align:center;">Our Impact</h1>
  <p class="body-lg text-muted" style="text-align:center; max-width:560px; margin: 8px auto var(--space-xl);">Every Kwacha donated through ZedFund is tracked from pledge to project — here's what that's added up to.</p>

  <div class="grid grid-3" id="impact-stats" style="margin-bottom: var(--space-xl);">
    <div class="card card-pad stat-card"><span class="stat-label">Funds Raised</span><span class="stat-value">—</span></div>
    <div class="card card-pad stat-card"><span class="stat-label">Campaigns Funded</span><span class="stat-value">—</span></div>
    <div class="card card-pad stat-card"><span class="stat-label">Provinces Reached</span><span class="stat-value">—</span></div>
  </div>

  <h2 class="headline-lg" style="margin-bottom: var(--space-md);">Campaigns by Category</h2>
  <div class="grid grid-3" id="category-breakdown"></div>
</main>

<div id="footer-root"></div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  renderNavbar('impact');
  renderFooter();

  async function load() {
    try {
      const { campaigns } = await api('/campaigns');
      const totalRaised = campaigns.reduce((s, c) => s + c.raised, 0);
      const provinces = new Set(campaigns.map((c) => c.province));

      document.getElementById('impact-stats').innerHTML = `
        <div class="card card-pad stat-card"><span class="stat-label">Funds Raised</span><span class="stat-value">${money(totalRaised)}</span></div>
        <div class="card card-pad stat-card"><span class="stat-label">Campaigns Funded</span><span class="stat-value">${campaigns.length}</span></div>
        <div class="card card-pad stat-card"><span class="stat-label">Provinces Reached</span><span class="stat-value">${provinces.size}</span></div>
      `;

      const byCategory = {};
      campaigns.forEach((c) => {
        byCategory[c.category] = byCategory[c.category] || { count: 0, raised: 0 };
        byCategory[c.category].count += 1;
        byCategory[c.category].raised += c.raised;
      });

      document.getElementById('category-breakdown').innerHTML = Object.entries(byCategory).map(([cat, v]) => `
        <div class="card card-pad stat-card">
          <span class="stat-label">${escapeHtml(cat)}</span>
          <span class="stat-value">${money(v.raised)}</span>
          <span class="label-sm text-muted">${v.count} campaign${v.count > 1 ? 's' : ''}</span>
        </div>
      `).join('');
    } catch (err) {
      document.getElementById('impact-stats').innerHTML = `<div class="alert alert-error" style="grid-column:1/-1;">${escapeHtml(err.message)}</div>`;
    }
  }
  load();
</script>
</body>
</html>
