<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — ZedFund</title>
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div id="navbar-root"></div>

<main class="auth-wrap">
  <div class="card auth-card">
    <a href="index.html" class="logo"><img src="images/logo.png" alt="ZedFund logo">ZedFund</a>
    <h1 class="headline-lg" style="text-align:center; margin-bottom:6px;">Create your account</h1>
    <p class="body-md text-muted" style="text-align:center; margin-bottom: var(--space-md);">Join Zambians funding real change, today.</p>

    <div id="form-alert"></div>

    <div class="role-toggle">
      <button type="button" class="role-toggle-btn selected" id="role-donor" data-role="donor">I want to donate</button>
      <button type="button" class="role-toggle-btn" id="role-organizer" data-role="organizer">I want to fundraise</button>
    </div>

    <form id="signup-form">
      <div class="field">
        <label>Full name</label>
        <input type="text" id="name" required placeholder="e.g. Mwansa Kabila">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html" class="text-primary" style="font-weight:600;">Log in</a></p>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  renderNavbar();
  if (isLoggedIn()) window.location.href = 'dashboard.html';

  let selectedRole = 'donor';
  document.getElementById('role-donor').addEventListener('click', () => setRole('donor'));
  document.getElementById('role-organizer').addEventListener('click', () => setRole('organizer'));
  function setRole(role) {
    selectedRole = role;
    document.getElementById('role-donor').classList.toggle('selected', role === 'donor');
    document.getElementById('role-organizer').classList.toggle('selected', role === 'organizer');
  }

  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('form-alert');
    const btn = document.getElementById('submit-btn');
    alertBox.innerHTML = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    try {
      const res = await api('/auth/signup', {
        method: 'POST',
        body: {
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          role: selectedRole
        }
      });
      setAuth(res.token, res.user);
      window.location.href = selectedRole === 'organizer' ? 'create-campaign.html' : 'discover.html';
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
      btn.disabled = false;
      btn.innerHTML = 'Create Account';
    }
  });
</script>
</body>
</html>
